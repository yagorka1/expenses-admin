<form [formGroup]="form" class="form" (submit)="submit()" data-testid="sign-in-form">
  <app-input
    class="input"
    formControlName="email"
    [label]="'Email'"
    type="email"
    data-testid="email-input"
  ></app-input>

  <app-input
    class="input"
    formControlName="password"
    [label]="'Password'"
    type="password"
    data-testid="password-input"
  ></app-input>

  <div class="footer">
    <app-button buttonType="submit" data-testid="submit-button">Log in</app-button>
  </div>
</form>
